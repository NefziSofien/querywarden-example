# A throwaway demo database. Local only, with passwords that protect nothing.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: demo-only
      POSTGRES_DB: bookshop
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookshop"]
      interval: 2s
      retries: 15
